name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    # Pinned: ubuntu-latest moved to Ubuntu 26.04 (Oct 2026), which has no
    # Python 3.9 builds; 24.04 still does, and 3.9 is our supported minimum.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The core.* modules under test have no GUI/numpy imports, so the dev deps
      # (pytest) are all that's needed — keeps CI fast.
      - run: pip install -r requirements-dev.txt
      - run: pytest

  test-gui:
    name: Test with GUI (py${{ matrix.python-version }})
    # The whole suite, with PyQt: the real window, serial ports on ptys, fake MQTT
    # and Modbus devices. The test job above skips all of those.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Libraries Qt loads even with the offscreen platform.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 libxkbcommon0 libfontconfig1
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: pytest
